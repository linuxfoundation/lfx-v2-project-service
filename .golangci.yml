# golangci-lint v2 configuration.
version: "2"

linters:
  exclusions:
    paths:
      # scripts/project-logo-file-conversion imports AWS SDK packages (s3,
      # checksum) that require network access to resolve in some environments
      # (e.g. the MegaLinter Docker image returns INTERNAL_ERROR from the Go
      # module proxy). Exclude the directory so typecheck failures there do not
      # break CI; the script is built and validated by `go build ./...`.
      - scripts/project-logo-file-conversion

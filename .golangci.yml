# golangci-lint v2 configuration.
version: "2"

linters:
  # Added on top of the v2 defaults (errcheck, govet, ineffassign, staticcheck,
  # unused).
  enable:
    # Sentinel errors must be compared with errors.Is/As so wrapping keeps working.
    - errorlint
    # Loop-variable copies are redundant since Go 1.22.
    - copyloopvar
    # Prefer net/http constants (http.MethodPost, http.StatusOK) over literals.
    - usestdlibvars
    # Enforces the structured-logging convention: no mixing key-value pairs with
    # slog.Attr arguments in one call.
    - sloglint
    # HTTP response bodies must be closed.
    - bodyclose
    # Outbound HTTP requests must carry a context.
    - noctx
    # An error that is checked but then dropped (returns nil) is usually a bug.
    - nilerr
    - misspell
  settings:
    misspell:
      # Goa names its JWT security interface "Auther".
      ignore-rules:
        - auther
  exclusions:
    rules:
      # scripts/project-logo-file-conversion imports AWS SDK packages (s3,
      # checksum) that require network access to resolve in some environments
      # (e.g. the MegaLinter Docker image returns INTERNAL_ERROR from the Go
      # module proxy). Suppress typecheck failures there so they do not break
      # CI; compile coverage is provided by `go test ./...` in the build workflow.
      - path: ^scripts/project-logo-file-conversion/
        linters: [typecheck]
